# 把磁贴 XML 发布到 GitHub Pages
#
# 每 15 分钟（以及每次 push / 手动触发 / 外部 workflow_dispatch）重新生成 tile.xml 并部署，
# 磁贴地址形如：https://<owner>.github.io/<repo>/tile.xml
#               https://<owner>.github.io/<repo>/pic/31.png
#
# 前提（只做一次）：
#   1. 仓库是 public（免费账号的 Pages 只对公开仓库开放）
#   2. Settings → Pages → Build and deployment → Source 选「GitHub Actions」
#   3. 可选：Settings → Secrets and variables → Actions → Variables 新建 TILE_BASE_URL，
#      填你的 Pages 根地址（仓库名带大写/自定义域名时建议填，否则自动按 owner.github.io/repo 推算）
#
# ⚠ 定时任务不可靠（这是备用源「15 分钟后就不更新」的根因）：
#   GitHub 对 schedule 只是「尽力而为」——高峰期会推迟，忙起来直接跳过，
#   本仓库实测出现过 4.6～8.7 小时才跑一次。Pages 是静态托管，自己不会更新，
#   所以 App 拿到的永远是上一次部署的副本。
#   真正能保证 15 分钟的办法：让 cloudflare-worker/ 里的 Worker 用 Cron Trigger
#   定时调本工作流的 workflow_dispatch（Worker 的 cron 是可靠的）。
#   另外：免费仓库连续 60 天无提交会停掉定时任务（手动 Run workflow 或 push 一次即可恢复）。

name: Publish live tile to GitHub Pages

on:
  schedule:
    # 每 15 分钟生成一次。注意：GitHub 会推迟甚至跳过这个定时任务（见文件开头的说明），
    # 所以真正的 15 分钟刷新要靠 cloudflare-worker/ 里的 Worker cron。
    # Pages 每仓库每小时约 10 次部署上限，下面的 gate 步骤会把重叠的触发去重。
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 强制重新生成（忽略「10 分钟内不重复部署」的去重）
        type: boolean
        default: false
  push:
    branches: [master, main]
    paths:
      - 'tile/**'
      - '.github/workflows/tile-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一个 Pages 部署在跑，避免并发互相覆盖
concurrency:
  group: tile-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # cron 叠加 push 时偶尔会排队；卡住的运行会占住下面的 concurrency 组，
    # 让后面每一次定时任务都排队到超时，所以给个硬上限。
    timeout-minutes: 20
    outputs:
      base: ${{ steps.base.outputs.base }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 解析磁贴根地址
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base="${{ vars.TILE_BASE_URL }}"
          if [ -z "$base" ]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
            repo="${GITHUB_REPOSITORY#*/}"
            base="https://${owner}.github.io/${repo}"
          fi
          base="${base%/}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "磁贴地址：$base/tile.xml"

      - name: 判断这次要不要真的重新生成
        id: gate
        # GitHub 的 schedule 和 Worker 的 workflow_dispatch 会重叠触发。谁先跑谁部署，
        # 后跑的那个如果发现线上快照还不到 10 分钟就跳过，免得把 Pages 的部署频率打满。
        # push 和手动 -f force=true 不过滤。
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.force }}" != "true" ]; then
            if python tile/check_freshness.py --base-url "${{ steps.base.outputs.base }}" --max-age 10 --strict >/dev/null 2>&1; then
              skip=true
              echo "线上快照还不到 10 分钟，跳过这次生成"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: 检查上次发布的新鲜度
        # 只做诊断：看看上一次生成到现在隔了多久。GitHub 的 schedule 会被推迟/跳过，
        # 这个数字就是「用户看到的磁贴为什么不动」的直接证据。
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tile/check_freshness.py --base-url "${{ steps.base.outputs.base }}" --max-age 45

      - name: 生成 tile.xml（含结构自检）
        if: steps.gate.outputs.skip != 'true'
        run: python tile/gen_tile.py --out "$GITHUB_WORKSPACE/_site" --base-url "${{ steps.base.outputs.base }}"

      - name: 提示 App 端地址是否一致
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.base }}"
          manifest="OneSentenceTile/Package.appxmanifest"
          if [ ! -f "$manifest" ]; then
            echo "::warning::没找到 $manifest，跳过一致性检查"
            exit 0
          fi
          uri=$(grep -o 'UriTemplate="[^"]*"' "$manifest" 2>/dev/null | head -n1 | sed 's/UriTemplate="//; s/"$//' || true)
          echo "App 清单里的磁贴地址：${uri:-（没找到）}"
          if [ -z "$uri" ]; then
            echo "::warning::清单里没找到 UriTemplate，磁贴只能靠 App 内的开关触发"
          elif [ "$uri" != "$base/tile.xml" ]; then
            echo "::warning::App 清单里的地址（$uri）与 Pages 地址（$base/tile.xml）不一致。跑 .\\set-tile-url.ps1 -BaseUrl $base 后重新打包，否则装出来的 App 仍会去旧地址拿磁贴。"
          else
            echo "OK：App 清单与 Pages 地址一致"
          fi

      - name: 检查 Pages 是否已启用
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              core.info(`Pages 已启用：${data.html_url}（build_type=${data.build_type}）`);
              if (data.build_type !== 'workflow') {
                core.warning(`Pages 的 Source 现在是 ${data.build_type}，要改成 GitHub Actions，否则下面的部署会失败`);
              }
            } catch (e) {
              if (e.status !== 404) throw e;
              core.warning('仓库还没启用 Pages。GITHUB_TOKEN 没有建站权限，只能手动开：');
              core.warning('Settings → Pages → Build and deployment → Source 选 GitHub Actions，然后重跑本工作流。');
              try {
                await github.rest.repos.createPagesSite({ owner, repo, build_type: 'workflow' });
                core.info('已自动开启 Pages（build_type=workflow）');
              } catch (err) {
                core.warning(`自动开启失败（${err.message}），请按上面的路径手动开启。`);
              }
            }

      - name: 配置 Pages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: 打包站点
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 失败时给排查提示
        if: failure()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### 这次部署失败了，按顺序检查

          1. **Settings → Pages → Source 是不是 GitHub Actions**
             （选 None 或 Deploy from a branch 都会让站点变成 404 Site not found）
          2. **仓库是不是 public**：免费账号的 Pages 只支持公开仓库，改成 private 会直接把站点下线
          3. 是不是有人点了 **Unpublish site**：重新选 Source 再重跑本工作流
          4. 仓库改名/转移过：磁贴地址要跟着改（跑 `set-tile-url.ps1` 后重新打包 App）

          工作流开头会尝试自动开启 Pages；如果那一步也报错（多半是权限或仓库是 private），
          按上面 1、2 手动处理即可。
          EOF

  deploy:
    needs: build
    # gate 判定「线上还很新」时 build 不产出 artifact，这里就别跑
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        # 自检要用 tile/check_freshness.py；Pages 产物在 build 任务的 artifact 里，这里只需要脚本
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署后自检
        shell: bash
        run: |
          set -uo pipefail
          base="${{ needs.build.outputs.base }}"
          # 注意：Pages 的 CDN 有 10 分钟缓存，不带 ?v= 时读到的可能是上一次的旧文件，
          # 这样自检会「假通过」。所有探测都加时间戳绕开缓存。
          fresh=0
          for i in 1 2 3 4 5 6 7 8; do
            stamp=$(date +%s)
            code=$(curl -sS -o /tmp/tile.xml -w '%{http_code}' "$base/tile.xml?v=$stamp" || true)
            echo "第 $i 次探测：HTTP $code"
            if [ "$code" = "200" ] && grep -qi '<binding template="TileLarge"' /tmp/tile.xml; then
              # health.json 也必须是「这一次」的，否则说明线上还是旧部署
              if python tile/check_freshness.py --base-url "$base" --max-age 10 --strict; then
                fresh=1
                break
              fi
            fi
            sleep 10
          done

          echo "===== tile.xml ====="
          head -c 400 /tmp/tile.xml; echo
          if [ "$code" != "200" ]; then
            echo "::error::部署后 $base/tile.xml 返回 $code"
            exit 1
          fi
          grep -qi '<binding template="TileLarge"' /tmp/tile.xml || { echo "::error::tile.xml 结构不对"; exit 1; }
          if [ "$fresh" != "1" ]; then
            echo "::error::部署后 80 秒内 health.json 仍不是新生成的（Pages 可能还没切到这次部署）"
            exit 1
          fi

          {
            echo "### 磁贴已发布"
            echo ""
            echo "- 磁贴 XML：$base/tile.xml"
            echo "- 自检信息：$base/health.json"
            echo "- 首页（含快照年龄）：$base/"
            echo ""
            echo "> Pages 是静态托管：这次发布之后，下一次刷新取决于 GitHub 的 cron。"
            echo "> GitHub 会推迟甚至跳过定时任务，想要稳定 15 分钟刷新，"
            echo "> 用 cloudflare-worker/ 里的 Worker cron 触发 workflow_dispatch。"
          } >> "$GITHUB_STEP_SUMMARY"
