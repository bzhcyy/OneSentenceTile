# 打 tag（v1.2.0、v1.3.0…）时自动编译 UWP 并发布 Release
#
# 用法：
#   git tag v1.3.0 && git push origin v1.3.0
#   或者 GitHub 网页 → Releases → Draft a new release → 选一个新 tag
#
# 产物：Release 附件里会有 .appxbundle 和签名用的 .cer

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: 前置检查（build-uwp.ps1）
        shell: pwsh
        run: |
          if (-not (Test-Path .\build-uwp.ps1)) { throw '缺少 build-uwp.ps1' }
          Write-Host "build-uwp.ps1 已就位"

      - name: 复用签名证书
        uses: actions/cache@v4
        with:
          path: build/cert
          key: uwp-dev-cert-v7

      - name: 打包
        shell: powershell
        run: .\build-uwp.ps1 -Configuration Release -NoDotNetNative

      - name: 失败时输出编译日志
        if: failure()
        shell: pwsh
        run: |
          $log = 'build/msbuild.log'
          if (-not (Test-Path $log)) { Write-Warning "没有 $log"; exit 0 }
          $tail = @(Get-Content $log -Tail 60)
          $tail | Write-Host
          # 让错误直接出现在 Actions 的 Annotations 里
          $errs = @($tail | Where-Object { $_ -match ': error' } | Select-Object -First 20)
          foreach ($e in $errs) { Write-Host ('::error::' + (($e -replace '[\r\n]+', ' ') -replace '%', '%25')) }
          '### msbuild 日志尾部（最后 60 行）' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $tail | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 校验产物
        shell: pwsh
        run: |
          $pkgs = @(Get-ChildItem OneSentenceTile/AppPackages -Recurse -File -Include *.appxbundle, *.msixbundle, *.appx, *.msix -ErrorAction SilentlyContinue)
          if ($pkgs.Count -eq 0) { throw '没有生成安装包' }
          $pkgs | ForEach-Object { Write-Host ("  " + $_.Name + "  " + [math]::Round($_.Length / 1MB, 2) + " MB") }

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 一言 Tile ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### 一言 Tile ${{ github.ref_name }}

            Windows 10/11 磁贴应用：每小时给你一句「一言」。

            **安装**：下载 `OneSentenceTile_*.appxbundle` 和同名 `.cer` →
            双击 `.cer` 安装到「受信任人」→ 双击 `.appxbundle` 安装。
            （或解压后运行 `Add-AppDevPackage.ps1`，它会自动装证书。）

            **磁贴服务器**：<https://bzhcyy.github.io/OneSentenceTile/>

            首次安装需信任自签证书；若装过旧包，请先卸载旧版。
          files: |
            OneSentenceTile/AppPackages/**/*.appxbundle
            OneSentenceTile/AppPackages/**/*.msixbundle
            OneSentenceTile/AppPackages/**/*.appx
            OneSentenceTile/AppPackages/**/*.msix
            build/cert/*.cer
          fail_on_unmatched_files: false
