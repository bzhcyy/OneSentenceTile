# Cloudflare Worker 配置
#
# 部署：
#   1. 安装 wrangler：npm i -g wrangler
#   2. wrangler login
#   3. wrangler secret put GITHUB_TOKEN      # 关键：让 cron 能触发 GitHub Actions
#   4. wrangler deploy
#
# 注意：cron 里的 */15 是「每 15 分钟」。GitHub 自己的 schedule 会被推迟/跳过，
# 实测 4～9 小时才跑一次；Worker 的 cron 是可靠的，所以由它来点 GitHub 的 workflow_dispatch。

name = "onesentencetile"
main = "worker.js"
compatibility_date = "2024-11-01"

# 每 15 分钟触发一次 tile-pages.yml（GitHub Actions 的 workflow_dispatch）
[triggers]
crons = ["*/15 * * * *"]

[vars]
GITHUB_REPO = "bzhcyy/OneSentenceTile"
TILE_WORKFLOW = "tile-pages.yml"
TILE_REF = "master"

# 不要把 token / REFRESH_TOKEN 写进这个文件（会进 git）：
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put REFRESH_TOKEN
